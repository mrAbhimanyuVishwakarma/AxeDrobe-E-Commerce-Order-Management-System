# Production: secrets must come from the environment, no defaults
spring.data.mongodb.uri=${MONGODB_URI}
app.jwt.secret=${JWT_SECRET}
app.product-service-url=${PRODUCT_SERVICE_URL}

# Aiven Kafka over SSL. Certificates are mounted as Render secret files.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=SSL
spring.ssl.bundle.pem.aiven.keystore.certificate=file:${KAFKA_CERT_PATH:/etc/secrets/service.cert}
spring.ssl.bundle.pem.aiven.keystore.private-key=file:${KAFKA_KEY_PATH:/etc/secrets/service.key}
spring.ssl.bundle.pem.aiven.truststore.certificate=file:${KAFKA_CA_CERT_PATH:/etc/secrets/ca.pem}
spring.kafka.ssl.bundle=aiven
