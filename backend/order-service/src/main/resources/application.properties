spring.application.name=order-service
server.port=${PORT:8083}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:axedrobe_orders}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-in-production-0123456789}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8082}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderPlaced:com.ecommerce.event.OrderPlacedEvent,orderCancelled:com.ecommerce.event.OrderCancelledEvent
# Fail fast instead of holding up checkout when the broker is unreachable
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.admin.operation-timeout=15s
app.kafka.topics.order-placed=order-created
app.kafka.topics.order-cancelled=order-cancelled

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
