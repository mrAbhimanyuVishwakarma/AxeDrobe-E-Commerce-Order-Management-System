spring.application.name=user-service
server.port=${PORT:8081}

# MongoDB - one cluster, one database per service
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:axedrobe_users}
spring.data.mongodb.auto-index-creation=true

app.brand-name=${BRAND_NAME:AxeDrobe}
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-in-production-0123456789}
app.jwt.ttl=${JWT_TTL:7d}
# Comma separated emails that get the ADMIN role when they sign in
app.admin-emails=${ADMIN_EMAILS:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Sign in with Google (OAuth client ID from Google Cloud console)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Shows the OTP on screen instead of requiring email/SMS delivery. Local development only.
app.otp.demo-mode=${OTP_DEMO_MODE:true}

# SMS codes: twofactor or fast2sms
app.sms.provider=${SMS_PROVIDER:}
app.sms.api-key=${SMS_API_KEY:}
app.sms.template=${SMS_TEMPLATE:}

# Email codes over SMTP
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:}
# Brevo HTTPS API key: used instead of SMTP when set (needed on hosts that block SMTP ports)
app.mail.brevo-api-key=${BREVO_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
