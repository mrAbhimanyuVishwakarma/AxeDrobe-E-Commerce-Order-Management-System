spring.application.name=notification-service
server.port=${PORT:8085}

app.brand-name=${BRAND_NAME:AxeDrobe}
app.store-url=${STORE_URL:http://localhost:5173}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderPlaced:com.ecommerce.notification.event.OrderPlacedEvent,orderCancelled:com.ecommerce.notification.event.OrderCancelledEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.notification.event
app.kafka.topics.order-placed=order-created
app.kafka.topics.order-cancelled=order-cancelled

# Order emails over SMTP (same settings as the user service)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:}
# Brevo HTTPS API key: used instead of SMTP when set (needed on hosts that block SMTP ports)
app.mail.brevo-api-key=${BREVO_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
