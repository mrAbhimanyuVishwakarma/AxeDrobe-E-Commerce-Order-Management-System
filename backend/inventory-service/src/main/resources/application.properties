spring.application.name=inventory-service
server.port=${PORT:8084}

app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-in-production-0123456789}
app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8082}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderPlaced:com.ecommerce.inventory.event.OrderPlacedEvent,orderCancelled:com.ecommerce.inventory.event.OrderCancelledEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.inventory.event
app.kafka.topics.order-placed=order-created
app.kafka.topics.order-cancelled=order-cancelled

management.endpoints.web.exposure.include=health,info
