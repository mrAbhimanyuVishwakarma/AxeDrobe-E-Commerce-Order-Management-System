spring.application.name=product-service
server.port=${PORT:8082}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:axedrobe_catalog}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-in-production-0123456789}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
# Load src/main/resources/catalog.json when the products collection is empty
app.catalog.seed=${CATALOG_SEED:true}

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
