# Runs the whole store locally: MongoDB, Kafka, the five services and the frontend.
# Optional settings (Google sign-in, SMTP, SMS) are read from a .env file next to this one.
x-backend-env: &backend-env
  MONGODB_URI: mongodb://mongo:27017
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  PRODUCT_SERVICE_URL: http://product-service:8082
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-in-production-0123456789}

x-mail-env: &mail-env
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  user-service:
    build: ./backend/user-service
    container_name: user-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      <<: [*backend-env, *mail-env]
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_DEMO_MODE: ${OTP_DEMO_MODE:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_TEMPLATE: ${SMS_TEMPLATE:-}
    depends_on:
      mongo:
        condition: service_healthy

  product-service:
    build: ./backend/product-service
    container_name: product-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      <<: *backend-env
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build: ./backend/order-service
    container_name: order-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      <<: *backend-env
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      product-service:
        condition: service_started

  inventory-service:
    build: ./backend/inventory-service
    container_name: inventory-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      <<: *backend-env
    depends_on:
      - kafka
      - product-service

  notification-service:
    build: ./backend/notification-service
    container_name: notification-service
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      <<: [*backend-env, *mail-env]
      STORE_URL: http://localhost:8080
    depends_on:
      - kafka

  frontend:
    build: ./frontend
    container_name: frontend
    restart: on-failure
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - product-service
      - order-service

volumes:
  mongo-data:
